<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agents IA System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .nav-item {
            padding: 10px 20px;
            border-radius: 50px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-item:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .complexity {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: #ddd;
            font-weight: 600;
        }
        
        .complexity.level1 { background: #51cf66; }
        .complexity.level2 { background: #fcc419; }
        .complexity.level3 { background: #ff922b; }
        .complexity.level4 { background: #ff6b6b; }
        .complexity.level5 { background: #cc5de8; }
        
        .ai-badge {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .chat-area {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .agent-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #f8f9fa;
            border-radius: 50px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #51cf66;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.agent .message-content {
            background: #e9ecef;
            border-left: 4px solid #667eea;
        }
        
        .message-agent-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 4px;
        }
        
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 50px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .chat-send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-menu {
                justify-content: center;
            }
            
            .chat-input-area {
                flex-direction: column;
            }
            
            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="#" class="navbar-brand">🤖 IA Agents KASAI 5</a>
            <div class="nav-menu">
                <a href="#" class="nav-item active" data-agent="base">
                    Base <span class="complexity level1">1</span>
                </a>
                <a href="#" class="nav-item" data-agent="echo">
                    Echo <span class="complexity level2">2</span>
                </a>
                <a href="#" class="nav-item" data-agent="assistant">
                    Assistant <span class="complexity level3">3</span> <span class="ai-badge">AI</span>
                </a>
                <a href="#" class="nav-item" data-agent="specialist">
                    Specialist <span class="complexity level4">4</span> <span class="ai-badge">AI</span>
                </a>
                <a href="#" class="nav-item" data-agent="collaborative">
                    Collaborative <span class="complexity level5">5</span> <span class="ai-badge">AI</span>
                </a>
            </div>
        </nav>

        <div class="chat-area">
            <div class="chat-header">
                <div>
                    <h2 id="agentName">🤖 Base Agent</h2>
                    <small id="agentDescription">Agent de base - Niveau 1</small>
                </div>
                <div class="agent-status">
                    <span class="status-dot"></span>
                    <span>En ligne</span>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message agent">
                    <div class="message-content">
                        <div class="message-agent-name">🤖 Base Agent</div>
                        Salut ! Je suis l'agent de base. Envoie-moi un message !
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" placeholder="Tapez votre message..." />
                <button class="chat-send-btn" id="sendBtn">Envoyer kkkkkk 🚀</button>
            </div>
        </div>
    </div>

    <!-- UNIQUEMENT CETTE LIGNE - PAS DE CODE JAVASCRIPT EN PLUS -->
    <script src="/static/script.js?v=5"></script>
</body>
</html>
